<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R Motors — Report officina</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f4f7; --surface: #ffffff; --border: #dde1e9;
      --ink: #0d1117; --ink-muted: #6b7280;
      --accent: #4a7fc1;
      --accent-dark: #1e3a5f;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Nunito', sans-serif;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER — identico al form SRS */
    .header {
      background: #ffffff;
      color: var(--ink);
      padding: .85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 3px solid var(--accent);
      box-shadow: 0 2px 12px rgba(74,127,193,.1);
    }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    .logo-riolo {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.55rem;
      color: var(--accent);
      letter-spacing: -.03em;
      line-height: 1;
    }
    .header-divider { width: 1px; height: 24px; background: var(--border); }
    .header-sede {
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .header-title {
      font-size: .85rem;
      font-weight: 700;
      color: var(--ink);
      margin-top: .1rem;
    }
    .header-date {
      font-family: var(--mono);
      font-size: .72rem;
      color: white;
      background: var(--accent);
      padding: .25rem .65rem;
      border-radius: 99px;
      font-weight: 600;
    }

    /* CONTAINER */
    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      max-width: 800px;
      width: 100%;
    }

    /* CARD */
    .card {
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    }

    /* IMMAGINE CARD */
    .card-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    /* BODY CARD */
    .card-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      flex: 1;
    }
    .card-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
    }
    .card-desc {
      font-size: 0.95rem;
      color: var(--ink-muted);
      line-height: 1.5;
    }

    /* PULSANTI */
    .card-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.5rem;
    }
    .btn {
      padding: 0.75rem 1.2rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      transition: 0.2s;
      display: block;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover {
      background: var(--accent-dark);
    }
    .btn-secondary {
      background: #f0f4ff;
      color: var(--accent);
      border: 1px solid #c0d0f0;
    }
    .btn-secondary:hover {
      background: #e0e8ff;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      color: var(--ink-muted);
      border-top: 1px solid var(--border);
      background: white;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .cards { grid-template-columns: 1fr; }
      .card-image { height: 180px; }
    }
  </style>
<link rel="icon" type="image/png" href="/report-officina/favicon.png">
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <span class="logo-riolo">riolo</span>
      <div class="header-divider"></div>
      <div>
        <div class="header-sede">Via Biagi</div>
        <div class="header-title">Report Officina</div>
      </div>
    </div>
    <span class="header-date" id="header-date"></span>
  </div>

  <!-- CARDS -->
  <div class="container">
    <div class="cards">

      <!-- CARD SRS -->
<a class="card" href="/report-officina/srs/">
  <img class="card-image" src="./passaggi/images/centralino.jpg" alt="SRS Tagliandi">
  <div class="card-body">
    <div class="card-title">📋 Tagliandi SRS</div>
    <div class="card-desc">Compila il report giornaliero dei tagliandi SRS</div>
  </div>
</a>

<!-- CARD PASSAGGI -->
<a class="card" href="/report-officina/passaggi/form.html">
  <img class="card-image" src="./passaggi/images/accettazione.jpg" alt="Passaggi Officina">
  <div class="card-body">
    <div class="card-title">🔧 Passaggi officina</div>
    <div class="card-desc">Compila il report giornaliero dei passaggi in officina e carrozzeria</div>
  </div>
</a>

    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    © 2026 Fabrizio Fundarò - R Motors, Via E.Biagi 8
  </div>

  <script>
    // Data in tempo reale — identico al form SRS
    const now = new Date();
    const giorni = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
    const mesi = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
    document.getElementById('header-date').textContent =
      `${giorni[now.getDay()]} ${now.getDate()} ${mesi[now.getMonth()]} ${now.getFullYear()}`;
  </script>

</body>
</html>
